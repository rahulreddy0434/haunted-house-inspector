version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - npm ci
    build:
      commands:
        - env | grep -e APP_AWS_REGION -e BEDROCK_MODEL_ID -e S3_BUCKET_NAME -e DYNAMODB_TABLE_NAME -e PRO_ACCESS_CODE -e NEXT_PUBLIC_ >> .env.production
        - npm run lint
        - npm run type-check
        - npm run test
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
